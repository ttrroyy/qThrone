# Optional drop-in: run rawline.service as the "rawline" user with five ambient capabilities instead of root.
# Tun and extra-core profiles work; the kill switch reports "unsupported", because it needs root.
# RawlineCore must carry no setuid bit or file capabilities: exec of such a file clears the ambient set.
# Install:
#   sudo useradd --system --no-create-home --home-dir /var/lib/rawline --shell /usr/sbin/nologin rawline
#   sudo install -Dm644 caps.conf /etc/systemd/system/rawline.service.d/caps.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rawline
# systemd hands the existing /var/lib/rawline over to the new user on the next start.
[Service]
User=rawline
Group=rawline
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
