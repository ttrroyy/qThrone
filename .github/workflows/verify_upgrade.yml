name: qThrone release validation
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Completed release build to validate
        required: true
      tag:
        description: Release version
        required: true
      publish:
        description: Publish the validated prerelease
        type: boolean
        default: false
jobs:
  verify-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build_sha: ${{ steps.verify.outputs.build_sha }}
      upgrade_verified: ${{ steps.verify.outputs.upgrade_verified }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: verify
        name: Verify artifacts match the current application sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/build-jobs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'build-run.json').read_text())
          jobs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'build-jobs.json').read_text())['jobs']
          assert run['path'] == '.github/workflows/build.yml' and run['status'] == 'completed' and run['conclusion'] == 'success'
          for prefixes, count in ((('qWDTT and CSQTT tests (', 'test-qwdtt ('), 3), (('build-go (',), 9), (('build-cpp (',), 11), (('Pack ',), 5), (('build-android',), 1)):
              required = [j for j in jobs if j['name'].startswith(prefixes)]
              assert len(required) == count and all(j['conclusion'] == 'success' for j in required), 'Required build checks failed: ' + str(prefixes)
          upgrade_verified = any(j['name'] == 'Verify portable Windows upgrade' and j['conclusion'] == 'success' for j in jobs)
          assert json.loads(Path('version.json').read_text())['version'] == os.environ['RELEASE_TAG']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build_sha=' + run['head_sha'] + '\n')
              output.write('upgrade_verified=' + str(upgrade_verified).lower() + '\n')
          PY
          build_sha=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/build-run.json"))["head_sha"])')
          git fetch origin "$build_sha" --depth=1
          git diff --name-only "$build_sha" "$GITHUB_SHA" > "$RUNNER_TEMP/build-changes.txt"
          while IFS= read -r path; do
            case "$path" in
              script/test_windows_upgrade.ps1|.github/workflows/verify_upgrade.yml) ;;
              *) echo "Application sources changed; a full rebuild is required: $path"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/build-changes.txt"
  test-upgrade:
    name: Verify portable Windows upgrade
    needs: verify-build
    if: needs.verify-build.outputs.upgrade_verified != 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: Pack-${{ needs.verify-build.outputs.build_sha }}-windows
          path: upgrade-package
      - name: Upgrade the previous release and verify the new bundled updater
        shell: pwsh
        run: ./script/test_windows_upgrade.ps1 -Archive "upgrade-package/qThrone-${{ inputs.tag }}-windows64.zip" -Version "${{ inputs.tag }}"
  publish:
    name: Publish validated prerelease
    needs: [verify-build, test-upgrade]
    if: always() && inputs.publish && needs.verify-build.result == 'success' && (needs.test-upgrade.result == 'success' || needs.test-upgrade.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: Pack-${{ needs.verify-build.outputs.build_sha }}-*
          merge-multiple: true
          path: deployment
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.verify-build.outputs.build_sha }}
        run: |
          set -euo pipefail
          python3 script/release_notes.py > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" deployment/* \
            --target "$RELEASE_SHA" --title "qThrone $RELEASE_TAG" --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
