name: qThrone release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
        default: "1.0"
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish anything"
        required: false
      common_run_id:
        description: "Reuse unchanged Go artifacts from a completed build; start at the GUI stage"
        required: false
      cpp_run_id:
        description: "Repair macOS ARM64 only; reuse the other 10 verified desktop builds from this completed run"
        required: false
      pack_run_id:
        description: "Repack macOS/debug only; reuse the verified ARM binary and Windows/Linux packages from this run"
        required: false
jobs:
  verify-pack:
    if: inputs.pack_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      pack_sha: ${{ steps.verify.outputs.pack_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_RUN_ID: ${{ inputs.pack_run_id }}
        run: |
          python3 -m unittest discover -s script -p test_verify_common_artifacts.py
          python3 script/verify_common_artifacts.py
  verify-cpp:
    if: inputs.cpp_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      cpp_sha: ${{ steps.verify.outputs.cpp_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: verify
        name: Verify unchanged desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CPP_RUN_ID: ${{ inputs.cpp_run_id }}
        run: |
          python3 -m unittest discover -s script -p test_verify_common_artifacts.py
          python3 script/verify_common_artifacts.py
  verify-common:
    if: inputs.common_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      common_sha: ${{ steps.verify.outputs.common_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: verify
        name: Verify unchanged Go artifacts and prerequisite checks
        env:
          GH_TOKEN: ${{ github.token }}
          COMMON_RUN_ID: ${{ inputs.common_run_id }}
        run: python3 script/verify_common_artifacts.py
  test-qwdtt:
    name: qWDTT and CSQTT tests (${{ matrix.os }})
    if: inputs.common_run_id == ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: qwdtt/go.sum
      - name: Test RAW, WG and authenticated SOCKS TCP/UDP
        shell: bash
        working-directory: qwdtt
        run: |
          go test -race ./...
          go vet ./...
      - name: Test SSTP userspace client
        shell: bash
        working-directory: sstp
        run: |
          go test -race ./...
          go vet ./...
      - name: Test YAML anchors and concurrent-test ownership
        if: matrix.os == 'ubuntu-latest'
        run: |
          c++ -std=c++20 -I. script/test_yaml_anchors.cpp -o "$RUNNER_TEMP/test-yaml-anchors"
          "$RUNNER_TEMP/test-yaml-anchors"
          c++ -std=c++20 -pthread -I. script/test_test_session_gate.cpp -o "$RUNNER_TEMP/test-session-gate"
          "$RUNNER_TEMP/test-session-gate"
      - name: Test updater archive validation
        shell: bash
        working-directory: updater
        run: |
          go test -race ./...
          go vet ./...
      - name: OpenFlux local TCP, UDP and lifecycle integration
        if: runner.os == 'Linux'
        shell: bash
        run: bash script/test_openflux.sh
      - name: Test olcRTC configuration and encrypted tunnel
        if: matrix.os == 'ubuntu-latest'
        run: bash script/test_olcrtc.sh
      - name: Install Protoc for core regression tests
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test extra-core shutdown and qWDTT probe lifecycle
        shell: bash
        working-directory: core
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          protoc -I gen --go_out=gen --go-grpc_out=gen gen/libcore.proto
          go test -race ./internal/process ./internal/rpc ./internal/probe ./internal/relay ./internal/parentcheck ./internal/providergeo
          # TrustTunnel races QUIC against its HTTP/2 fallback like the official client.
          CGO_ENABLED=0 go test -tags with_quic,with_utls,with_purego github.com/xchacha20-poly1305/sing-trusttunnel
          go vet ./internal/process ./internal/rpc ./internal/relay ./internal/parentcheck ./internal/providergeo
  build-go:
    if: inputs.common_run_id == ''
    needs: test-qwdtt
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - cross_os: windows
            cross_arch: amd64
            go_version: "1.27.0"
            runner: ubuntu-22.04
          - cross_os: windows
            cross_arch: arm64
            go_version: "1.27.0"
            runner: ubuntu-22.04
          - cross_os: linux
            cross_arch: amd64
            go_version: "1.27.0"
            runner: ubuntu-22.04
          - cross_os: linux
            cross_arch: arm64
            go_version: "1.27.0"
            runner: ubuntu-22.04
          - cross_os: darwin
            cross_arch: amd64
            go_version: "1.27.0"
            runner: macos-15-intel
          - cross_os: darwin
            cross_arch: arm64
            go_version: "1.27.0"
            runner: macos-15-intel
          - cross_os: darwinlegacy
            cross_arch: amd64
            go_version: "1.27.0"
            runner: macos-15-intel
          - cross_os: windowslegacy
            cross_arch: amd64
            go_version: "1.27.0"
            runner: macos-15-intel
          - cross_os: windowslegacy
            cross_arch: 386
            go_version: "1.27.0"
            runner: macos-15-intel
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      DEST: ${{ github.workspace }}/deployment/${{ matrix.cross_os }}-${{ matrix.cross_arch }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6.1.0
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'script/build_openflux.sh', 'script/openflux/**', 'script/build_olcrtc.sh', 'script/olcrtc/**', 'script/build_dnstunnels.sh', 'script/openfluxkey/**', 'script/build_wdttplus.sh', 'script/dnstun/**', 'script/masterdns/**', 'script/cottendns/**', 'script/soar/**',  'script/s3bypass/**', 'script/fetch_pinned_source.py', 'transport-sources.lock.json', 'core/**', 'qwdtt/**', 'sstp/**') }}-${{ matrix.go_version }}
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: |
            core/go.sum
      - name: Install Golang For Legacy OS
        if: steps.cache-common.outputs.cache-hit != 'true' && contains( matrix.cross_os, 'legacy' )
        run: |
          # MetaCubeX/go restores Win7 / macOS 10.15 support; stay on 1.26 since Go 1.27 drops macOS < 13
          mkdir -p golang.org
          curl -fL "https://github.com/MetaCubeX/go/releases/download/build/go1.26.$(go env GOHOSTOS)-$(go env GOHOSTARCH).tar.gz" | tar -xz -C golang.org
      - name: Install Protoc
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Clone cronet-go
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/throneproj/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "2ee86b72426042457b8eb879ab32296f5752bf2f"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
      - name: Download Chromium toolchain
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} download-toolchain
      - name: Set Chromium toolchain environment
        if: matrix.cross_os == 'linux'
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} env >> $GITHUB_ENV
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz
          compression-level: 0
  build-android:
    if: inputs.common_run_id == ''
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      DEST: ${{ github.workspace }}/deployment/android
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            core/go.sum
      - name: Install JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          set -xeuo pipefail
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
      - name: Build Android AAR
        shell: bash
        run: ./script/build_android.sh
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ThroneCore-android-${{ github.sha }}
          path: deployment/android/ThroneCore.aar
          if-no-files-found: error
          compression-level: 0
  build-cpp:
    permissions:
      contents: read
      actions: read
    needs:
      - build-go
      - verify-common
      - verify-cpp
    if: always() && inputs.pack_run_id == '' && (needs.verify-cpp.result == 'success' || needs.verify-cpp.result == 'skipped') && ((needs.build-go.result == 'success' && needs.verify-common.result == 'skipped') || (needs.build-go.result == 'skipped' && needs.verify-common.result == 'success'))
    strategy:
      matrix:
        include: >-
          ${{ fromJSON(inputs.cpp_run_id != '' &&
          '[{"platform":"macos-15-intel","qt_version":"6.11.2","target":"arm64","dest_suffix":"darwin-arm64","common":"darwin-arm64","launcher":"ccache"}]' ||
          '[
          {"platform":"windows-latest","qt_version":"6.11.2","target":"x64","dest_suffix":"windows-amd64","common":"windows-amd64","launcher":"sccache"},
          {"platform":"windows-11-arm","qt_version":"6.11.2","target":"arm64","dest_suffix":"windows-arm64","common":"windows-arm64","launcher":""},
          {"platform":"ubuntu-22.04","qt_version":"6.11.2","target":"x86_64","dest_suffix":"linux-amd64","common":"linux-amd64","launcher":"ccache"},
          {"platform":"ubuntu-22.04","qt_version":"6.2.0","target":"x86_64","dest_suffix":"linux-amd64-system-qt","common":"linux-amd64","launcher":"ccache"},
          {"platform":"ubuntu-24.04-arm","qt_version":"6.11.1","target":"aarch64","dest_suffix":"linux-arm64","common":"linux-arm64","launcher":"ccache"},
          {"platform":"ubuntu-22.04-arm","qt_version":"6.2.0","target":"aarch64","dest_suffix":"linux-arm64-system-qt","common":"linux-arm64","launcher":"ccache"},
          {"platform":"macos-15-intel","qt_version":"6.11.2","target":"x86_64","dest_suffix":"darwin-amd64","common":"darwin-amd64","launcher":"ccache"},
          {"platform":"macos-15-intel","qt_version":"6.11.2","target":"arm64","dest_suffix":"darwin-arm64","common":"darwin-arm64","launcher":"ccache"},
          {"platform":"macos-15-intel","qt_version":"6.4.3","target":"x86_64","dest_suffix":"darwinlegacy-amd64","common":"darwinlegacy-amd64","launcher":"ccache"},
          {"platform":"windows-latest","qt_version":"6.2.13","target":"x64","dest_suffix":"windowslegacy-amd64","common":"windowslegacy-amd64","launcher":"sccache"},
          {"platform":"windows-2022","qt_version":"6.2.13","target":"x86","dest_suffix":"windowslegacy-386","common":"windowslegacy-386","launcher":"sccache"}
          ]') }}
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
      DEST: ${{ github.workspace }}/deployment/${{ matrix.dest_suffix }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
      ARCH: ${{ matrix.target }}
      LAUNCHER_ARGS: ${{ matrix.launcher != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0} -DCMAKE_CXX_COMPILER_LAUNCHER={0}', matrix.launcher) || '' }}
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          # Read-only pack files make this flaky on Windows; cmake filters .git out anyway.
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          # cmake globs res/dashboard at configure time and silently ships nothing if it
          # is empty, so fail here instead of releasing a build without the dashboard.
          test -f res/dashboard/index.html
      - name: Install MSVC compiler
        if: contains( matrix.platform, 'windows' )
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target }}
      - name: Setup compiler cache
        if: matrix.launcher != ''
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.dest_suffix }}-${{ matrix.qt_version }}
          variant: ${{ matrix.launcher }}
          max-size: 500M
      - name: Install NASM for 32-bit CSQTT cryptography
        if: runner.os == 'Windows' && matrix.target == 'x86'
        shell: pwsh
        run: |
          $nasmArchive = Join-Path $env:RUNNER_TEMP 'nasm-3.02-win64.zip'
          Invoke-WebRequest -Uri 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip' -OutFile $nasmArchive -TimeoutSec 60
          if ((Get-FileHash -LiteralPath $nasmArchive -Algorithm SHA256).Hash -ne '161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7') { throw 'NASM archive checksum mismatch' }
          $nasmRoot = Join-Path $env:RUNNER_TEMP 'nasm-toolchain'
          Expand-Archive -LiteralPath $nasmArchive -DestinationPath $nasmRoot -Force
          $nasmDirectory = Join-Path $nasmRoot 'nasm-3.02'
          if (!(Test-Path (Join-Path $nasmDirectory 'nasm.exe'))) { throw 'NASM executable missing' }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build original CSQTT transport
        shell: bash
        run: bash script/build_csqtt.sh
      - name: Build SlipStream client
        shell: bash
        run: bash script/build_slipstream.sh
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.common_run_id || github.run_id }}
          name: Throne-${{ needs.verify-common.outputs.common_sha || github.sha }}-Common-${{ matrix.common }}
          path: download-artifact
      # ========================================================================================================= Qt Install
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        if: (!contains(matrix.platform, 'windows')) && matrix.qt_version != '6.2.0'
        with:
          version: ${{ matrix.qt_version }}
          setup-python: true
          cache: true
          cache-key-prefix: QtCache-${{ matrix.dest_suffix }}
      # ========================================================================================================= Generate MakeFile and Build
      - name: Windows - Cache Qt and OpenSSL
        id: cache-winqt
        if: contains( matrix.platform, 'windows' )
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-${{ matrix.qt_version }}-${{ matrix.target }}
      - name: Windows - Download Qt and OpenSSL
        shell: bash
        if: contains( matrix.platform, 'windows' ) && steps.cache-winqt.outputs.cache-hit != 'true'
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_${{ matrix.qt_version }}/Qt_${{ matrix.qt_version }}_${{ matrix.target }}.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_${{ matrix.target }}.7z
      - name: Windows - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'windows' )
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - name: Linux - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version != '6.2.0'
        run: |
          sudo apt update
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64.sh
      - name: Linux Using System Qt - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'ubuntu' ) && matrix.qt_version == '6.2.0'
        run: |
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev qt6-translations-l10n libglx-dev libgl1-mesa-dev
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc" $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_linux64_system_qt.sh
      - name: Test qWDTT clipboard and subscription import
        if: contains(matrix.platform, 'ubuntu') && matrix.qt_version == '6.2.0'
        env:
          QT_QPA_PLATFORM: offscreen
          THRONE_SEASONAL_PREVIEW_DIR: ${{ runner.temp }}/seasonal-preview
        run: '"$DEST/qThrone" --self-test-qwdtt-import'
      - name: Upload seasonal window previews
        if: always() && contains(matrix.platform, 'ubuntu') && matrix.qt_version == '6.2.0'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Seasonal-preview-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/seasonal-preview/*.png
      - name: macOS - Generate MakeFile and Build
        shell: bash
        if: contains( matrix.platform, 'macos' )
        run: |
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNKR_PACKAGE_MACOS=1 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target }} $LAUNCHER_ARGS ..
          ninja
          cd ..
          ./script/deploy_macos.sh
      - name: Test packaged Windows core startup
        if: contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$env:DEST/qThrone.exe" -ArgumentList '--self-test-core-startup' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged core startup failed: $($process.ExitCode)" }
      - name: Test packaged Linux core startup
        if: contains(matrix.platform, 'ubuntu') && matrix.qt_version == '6.2.0'
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"$DEST/qThrone" --self-test-core-startup'
      - name: Verify packaged macOS architectures
        if: contains(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q '^Mach-O'; then
              lipo "$binary" -verify_arch "$ARCH"
              count=$((count + 1))
            fi
          done < <(find "$DEST/qThrone.app" -type f -print0)
          test "$count" -gt 0
      - name: Test packaged macOS core startup
        # An Intel runner can build and inspect ARM binaries, but cannot execute them.
        if: contains(matrix.platform, 'macos') && (matrix.target == 'x86_64' || runner.arch == 'ARM64')
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"$DEST/qThrone.app/Contents/MacOS/qThrone" --self-test-core-startup'
      # ========================================================================================================= Deployments
      - name: Tar files
        shell: bash
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-${{ matrix.dest_suffix }}
          path: artifacts.tgz
          compression-level: 0
  pack:
    name: Pack ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - build-cpp
      - verify-cpp
      - verify-pack
    if: always() && (needs.build-cpp.result == 'success' || needs.verify-pack.result == 'success') && (needs.verify-cpp.result == 'success' || needs.verify-cpp.result == 'skipped')
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        include: >-
          ${{ fromJSON(inputs.pack_run_id != '' &&
          '[{"target":"macos","runner":"ubuntu-latest","artifacts":"darwin*"},{"target":"debug","runner":"ubuntu-latest","artifacts":"*"}]' ||
          '[
          {"target":"windows","runner":"windows-latest","artifacts":"windows*"},
          {"target":"linux-amd64","runner":"ubuntu-latest","artifacts":"linux-amd64*","tools":"rpm"},
          {"target":"linux-arm64","runner":"ubuntu-latest","artifacts":"linux-arm64*","tools":"rpm"},
          {"target":"macos","runner":"ubuntu-latest","artifacts":"darwin*"},
          {"target":"debug","runner":"ubuntu-latest","artifacts":"*"}
          ]') }}
      fail-fast: false
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Throne-${{ github.sha }}-${{ matrix.artifacts }}
          path: download-artifact
        if: inputs.cpp_run_id == '' && inputs.pack_run_id == ''
      - name: Download verified ARM binary into its artifact directory
        if: (inputs.cpp_run_id != '' || inputs.pack_run_id != '') && (matrix.target == 'macos' || matrix.target == 'debug')
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pack_run_id || github.run_id }}
          name: Throne-${{ needs.verify-pack.outputs.pack_sha || github.sha }}-darwin-arm64
          path: download-artifact/Throne-${{ needs.verify-pack.outputs.pack_sha || github.sha }}-darwin-arm64
      - name: Download verified unchanged desktop artifacts
        if: inputs.cpp_run_id != ''
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cpp_run_id }}
          pattern: Throne-${{ needs.verify-cpp.outputs.cpp_sha }}-${{ matrix.artifacts }}
          path: download-artifact
      - name: Install packaging tools
        if: matrix.tools
        run: sudo apt install ${{ matrix.tools }}
      - name: Pack
        shell: bash
        run: bash ./script/pack_release.sh ${{ matrix.target }} "${{ github.event.inputs.tag }}"
      - name: Uploading Artifact
        if: matrix.target != 'debug'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Pack-${{ github.sha }}-${{ matrix.target }}
          path: deployment/qThrone-*
          if-no-files-found: error
          compression-level: 0
      - name: Uploading Debug Artifact
        if: matrix.target == 'debug'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Debug-${{ github.sha }}
          path: deployment/debug-symbols.zip
          if-no-files-found: error
          compression-level: 0
  pack-arch:
    name: Pack and verify Arch Linux x86_64
    runs-on: ubuntu-latest
    needs: [pack, verify-pack]
    if: always() && needs.pack.result == 'success'
    container: archlinux:base-devel
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prepare Arch environment
        run: pacman -Syu --noconfirm git python unzip sudo xorg-server-xvfb xorg-xauth xdotool weston desktop-file-utils namcap
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pack_run_id || github.run_id }}
          pattern: Pack-${{ needs.verify-pack.outputs.pack_sha || github.sha }}-linux-*
          merge-multiple: true
          path: release-archives
      - name: Package current release binaries
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python script/prepare_arch_release.py "$RELEASE_TAG" release-archives arch-build
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd arch-build
          su builder -c "cd '$PWD' && makepkg -s --noconfirm"
          pacman -U --noconfirm ./*.pkg.tar.zst
          namcap ./*.pkg.tar.zst > namcap.log
          desktop-file-validate /usr/share/applications/qThrone.desktop
          for binary in qThrone qThroneCore qThroneUpdater qwdtt olcrtc openflux openfluxkey csqtt-transport dnstun masterdns cottendns soar s3bypass  slipstream-client wdttplus-client sstp-client; do
            ldd "/usr/lib/qthrone/$binary" >> dependencies.log 2>&1 || true
          done
          find /usr/lib/qthrone/usr/plugins -name '*.so' -exec ldd '{}' \; >> dependencies.log 2>&1
          if grep 'not found' dependencies.log; then exit 1; fi
          su builder -c "bash '$GITHUB_WORKSPACE/script/test_arch_package.sh' '$PWD'"
          su builder -c 'xvfb-run -a dbus-run-session -- /usr/bin/qthrone --self-test-core-startup'
          test -d /home/builder/.config/qThrone
          pacman -R --noconfirm qthrone-bin
          test ! -e /usr/lib/qthrone
          test -d /home/builder/.config/qThrone
          mkdir -p "$GITHUB_WORKSPACE/deployment"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/deployment/qThrone-$RELEASE_TAG-arch-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Pack-${{ github.sha }}-arch
          path: deployment/qThrone-*-arch-x86_64.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: Arch-validation-${{ github.sha }}
          path: arch-build/*.log
  test-windows-upgrade:
    name: Verify portable Windows upgrade
    runs-on: windows-latest
    needs: [pack, verify-pack]
    if: always() && needs.pack.result == 'success' && github.event.inputs.tag != '1.0-beta.1'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pack_run_id || github.run_id }}
          name: Pack-${{ needs.verify-pack.outputs.pack_sha || github.sha }}-windows
          path: upgrade-package
      - name: Upgrade the previous release and verify the new bundled updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./script/test_windows_upgrade.ps1 -Archive "upgrade-package/qThrone-${{ github.event.inputs.tag }}-windows64.zip" -Version "${{ github.event.inputs.tag }}"
      - name: Verify localized installer and complete uninstall
        shell: pwsh
        run: ./script/test_windows_installer.ps1 -Installer "upgrade-package/qThrone-${{ github.event.inputs.tag }}-windows-universal-installer.exe"
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - pack
      - test-windows-upgrade
      - pack-arch
      - verify-pack
    if: always() && needs.pack.result == 'success' && needs.pack-arch.result == 'success' && (needs.test-windows-upgrade.result == 'success' || needs.test-windows-upgrade.result == 'skipped')
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pack-${{ github.sha }}-*
          merge-multiple: true
          path: deployment
      - name: Download verified Windows and Linux packages
        if: inputs.pack_run_id != ''
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.pack_run_id }}
          pattern: Pack-${{ needs.verify-pack.outputs.pack_sha }}-*
          merge-multiple: true
          path: deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Deployment-${{ github.sha }}
          path: deployment
          compression-level: 0
      - name: Promote verified release commit to stable
        if: github.event.inputs.publish == 'r'
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow origin; else git fetch origin; fi
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA" || { echo "dev advanced during this build; refusing to promote untested changes"; exit 1; }
          git merge-base --is-ancestor origin/stable "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/stable"
      - name: Publish release
        if: github.event.inputs.publish == 'p' || (github.event.inputs.publish == 'r' && github.ref_name == 'stable')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_KIND: ${{ github.event.inputs.publish }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 script/release_notes.py > "$RUNNER_TEMP/release-notes.md"
          RELEASE_GIT_TAG=$(python3 -c 'import re,sys; assert re.fullmatch(r"\d+\.\d+(?:\.\d+)?(?:-(?:alpha|beta|rc)\.\d+)?",sys.argv[1]); print("v"+sys.argv[1])' "$RELEASE_TAG")
          args=()
          if [[ "$RELEASE_KIND" == p ]]; then args+=(--prerelease); fi
          title="$RELEASE_TAG"
          gh release create "$RELEASE_GIT_TAG" deployment/* \
            --target "$RELEASE_SHA" --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
      - name: Publish verified packages from stable
        if: github.event.inputs.publish == 'r' && github.ref_name != 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-verified.yml --ref stable -f run_id="$GITHUB_RUN_ID"
  # Updates the AUR package after a stable release.
  publish-aur:
    name: Publish AUR Package
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.repository == 'throneproj/Throne' && github.event.inputs.publish == 'r'
    permissions:
      contents: read
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
      - name: Validate version and update PKGBUILD
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._+]+$ ]]; then
            echo "::error::Cannot publish '$VERSION' to AUR: not a valid pkgver. AUR is only updated for stable releases (publish=r)."
            exit 1
          fi
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/;s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: throne
          asset_dir: aur
          updpkgsums: true
          commit_username: throneproj-bot
          commit_email: throneproj-bot@users.noreply.github.com
          commit_message: Update to ${{ github.event.inputs.tag }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
  # Publishes the RPM and APT repositories to this repository's GitHub Pages,
  # served at https://throneproj.github.io/Throne/rpm/ and
  # https://throneproj.github.io/Throne/apt/.
  publish-repos:
    name: Publish RPM and APT Repositories
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.repository == 'throneproj/Throne' && github.event.inputs.publish == 'r'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Must match the key in the REPO_SIGNING_KEY secret of the github-pages environment.
      SIGNING_FPR: 5EEB21A857E9C485DBA5F4E000316AB4369049D6
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: Pack-${{ github.sha }}-linux-*
          merge-multiple: true
          path: deployment
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y createrepo-c dpkg-dev apt-utils rpm
      - name: Import signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REPO_SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_FPR" > /dev/null
          mkdir -p repo
          gpg --batch --armor --export "$SIGNING_FPR" > repo/throne.asc
      - name: Build RPM repository
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          AMD64="deployment/Throne-${VERSION}-fedora-amd64-system-qt.rpm"
          ARM64="deployment/Throne-${VERSION}-fedora-arm64-system-qt.rpm"
          test -f "$AMD64" && test -f "$ARM64"
          mkdir -p repo/rpm
          cp "$AMD64" "$ARM64" repo/rpm/
          # Signing rewrites the files, so it must run before createrepo_c checksums them.
          rpmsign --addsign --define "_gpg_name $SIGNING_FPR" repo/rpm/*.rpm
          createrepo_c repo/rpm
          gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign repo/rpm/repodata/repomd.xml
          printf '%s\n' '[throne]' 'name=Throne RPM repository' \
            'baseurl=https://throneproj.github.io/Throne/rpm' \
            'enabled=1' 'autorefresh=1' 'gpgcheck=1' 'repo_gpgcheck=1' \
            'gpgkey=https://throneproj.github.io/Throne/throne.asc' > repo/rpm/throne.repo
      - name: Build APT repository
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          AMD64="deployment/Throne-${VERSION}-debian-amd64-system-qt.deb"
          ARM64="deployment/Throne-${VERSION}-debian-arm64-system-qt.deb"
          test -f "$AMD64" && test -f "$ARM64"
          mkdir -p repo/apt/pool/main \
            repo/apt/dists/stable/main/binary-amd64 \
            repo/apt/dists/stable/main/binary-arm64
          # dpkg-scanpackages --arch only picks up files named *_<arch>.deb.
          cp "$AMD64" "repo/apt/pool/main/throne_${VERSION}_amd64.deb"
          cp "$ARM64" "repo/apt/pool/main/throne_${VERSION}_arm64.deb"
          cd repo/apt
          for arch in amd64 arm64; do
            dpkg-scanpackages --arch "$arch" pool /dev/null > "dists/stable/main/binary-${arch}/Packages"
            gzip -k9 "dists/stable/main/binary-${arch}/Packages"
          done
          # Staged outside dists/stable, which apt-ftparchive scans, so Release does not list itself.
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=throne \
            -o APT::FTPArchive::Release::Label=Throne \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o 'APT::FTPArchive::Release::Architectures=amd64 arm64' \
            -o APT::FTPArchive::Release::Components=main \
            -o 'APT::FTPArchive::Release::Description=Throne APT repository' \
            release dists/stable > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" dists/stable/Release
          gpg --batch --yes --local-user "$SIGNING_FPR" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/throne.asc] https://throneproj.github.io/Throne/apt stable main' > throne.list
          # deb822 multi-line field: every line indented, blank lines written as " .".
          { printf '%s\n' 'Types: deb' \
              'URIs: https://throneproj.github.io/Throne/apt' \
              'Suites: stable' 'Components: main' 'Signed-By:'
            sed 's/^$/./; s/^/ /' ../throne.asc; } > throne.sources
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
