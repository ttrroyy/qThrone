name: Database preservation
on:
  push:
    branches: [dev, stable]
    paths: ['include/database/PreserveDatabaseFiles.h', 'src/database/DatabaseManager.cpp', 'script/test_database_preservation.cpp', 'script/fetch_pinned_source.py', 'transport-sources.lock.json', '.github/workflows/data-preservation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Recover pinned transport sources from release snapshots
        run: |
          python3 - <<'PY'
          import json, tempfile
          from script.fetch_pinned_source import fetch
          with tempfile.TemporaryDirectory() as folder:
              for index, (repository, entry) in enumerate(json.load(open('transport-sources.lock.json')).items()):
                  fetch(repository, entry['revision'], folder + '/' + str(index), snapshot_only=True)
          PY
      - name: Install Qt development files
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev pkg-config
      - name: Test preservation and failed rename
        run: |
          g++ -std=c++17 -fPIC -I. script/test_database_preservation.cpp $(pkg-config --cflags --libs Qt6Core) -o /tmp/test-preservation
          /tmp/test-preservation
