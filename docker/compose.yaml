# Headless Rawline; https://throneproj.github.io/headless/ has the full guide. Manage it with rawlinectl inside the container, where the
# management API listens (loopback only by default):
#   docker compose exec rawline sh -c 'eval "$(/opt/Rawline/Rawline --print-connection)" && rawlinectl status'
#   docker compose exec -T rawline sh -c 'eval "$(/opt/Rawline/Rawline --print-connection)" && rawlinectl import -' < links.txt
services:
  rawline:
    image: ghcr.io/throneproj/rawline:latest   # or a release tag
    restart: unless-stopped
    # Rawline stops the core and then the kill switch; Docker's default 10 s would cut that short.
    stop_grace_period: 45s
    # Tun mode and the kill switch; a proxy-only setup needs neither.
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["rawline-data:/var/lib/rawline"]
    # Mixed (HTTP + SOCKS) inbound. It listens on 127.0.0.1 by default, which a port mapping cannot reach:
    #   rawlinectl settings set inbound_address=0.0.0.0
    # This mapping opens it on every host interface; on a host the internet reaches, map only the LAN address
    # ("192.168.1.2:2080:2080"): Docker's published ports bypass host firewalls such as ufw.
    ports: ["2080:2080"]
    # Gateway use: share the host's network instead (drop ports:). Tun and the kill switch then act on the whole host,
    # and only one Tun-owning Rawline may run on it.
    # network_mode: host
    # Rawline API from the local network, such as rawlinectl on a desktop (the key is /var/lib/rawline/config/api.key).
    # Over a port mapping every request comes from outside the container, so management (import, settings, backup)
    # also needs RAWLINE_API_ADMIN_LAN; leave it off to only monitor and switch profiles from the LAN.
    # environment:
    #   RAWLINE_API_LISTEN: "*:9095"
    #   RAWLINE_API_ALLOW: "192.168.1.0/24"
    #   RAWLINE_API_ADMIN_LAN: "1"
    # ports: ["2080:2080", "9095:9095"]
volumes:
  rawline-data:
